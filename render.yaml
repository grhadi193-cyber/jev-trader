services:
  - type: web
    name: jev-trader-demo
    runtime: docker
    plan: free
    branch: demo-deploy
    dockerfilePath: ./Dockerfile
    # Render sets PORT automatically (10000); our server respects process.env.PORT with fallback 3000.
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: MODEL
        value: mock
      - key: DRY_RUN
        value: "true"
      - key: PORT
        value: "10000"
      - key: RPC_URL
        value: https://rpc.monad.xyz
      - key: READ_RPC_URL
        value: https://rpc.monad.xyz
      # PRIVATE_KEY is intentionally NOT defined — demo is dry-run only with simulated fills.
      # Do not add PRIVATE_KEY, TYPESAFE_AI_API_KEY, or any secret here.
