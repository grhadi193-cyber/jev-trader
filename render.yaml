services:
  - type: web
    name: jev-trader-demo
    runtime: docker
    plan: free
    branch: demo-deploy
    dockerfilePath: ./Dockerfile
    # Render sets PORT automatically (10000); our server respects process.env.PORT with fallback 3000.
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: MODEL
        value: jev
      - key: JEV_MODEL_ID
        value: jev-1.13-free
      - key: TYPESAFE_AI_BASE_URL
        value: https://api.beatapi.io/v1
      - key: DRY_RUN
        value: "true"
      - key: PORT
        value: "10000"
      - key: RPC_URL
        value: https://rpc.monad.xyz
      - key: READ_RPC_URL
        value: https://rpc.monad.xyz
      - key: TYPESAFE_AI_API_KEY
        sync: false
      # PRIVATE_KEY is intentionally NOT defined — demo is dry-run only (beatapi.io free Jev, no balance needed)
      # Add BEATAPI_API_KEY alias also works. Do not add PRIVATE_KEY here.
